# endpoints.yml
#
# Runtime endpoint and model configuration for the conversational agent.
#
# This configuration defines:
# - the conversational action server endpoint
# - the language model used for flow orchestration
# - the embedding model used for semantic flow retrieval
#
# Environment variables are resolved using:
# ${VARIABLE_NAME}

# ------------------------------------------------------------------------------
# Action Server
# ------------------------------------------------------------------------------

action_endpoint:
  url: "http://localhost:5055/webhook"

# ------------------------------------------------------------------------------
# Language Models
# ------------------------------------------------------------------------------

model_groups:

  # Primary orchestration model used for:
  # - conversational reasoning
  # - flow selection
  # - slot extraction
  - id: nebius_llm

    models:
      - provider: self-hosted
        model: meta-llama/Llama-3.3-70B-Instruct

        api_base: "https://api.tokenfactory.nebius.com/v1"
        api_key: ${NEBIUS_KEY}

        temperature: 0.1
        max_tokens: 512
        timeout: 30

  # Embedding model used for semantic flow retrieval.
  - id: nebius_embeddings

    models:
      - provider: openai
        model: Qwen/Qwen3-Embedding-8B

        api_base: "https://api.tokenfactory.nebius.com/v1"
        api_key: ${NEBIUS_KEY}
